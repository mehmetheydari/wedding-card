<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فرشاد و پریا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fbf6ea;
    --cream-deep:#f3ead4;
    --gold:#b8873a;
    --gold-deep:#8a6120;
    --gold-light:#d9b877;
    --ink:#3a2c14;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--cream);
    font-family:'Vazirmatn', sans-serif;
    display:flex;
    justify-content:center;
    padding:32px 12px;
    color:var(--ink);
  }
  .card{
    position:relative;
    width:100%;
    max-width:480px;
    background:
      radial-gradient(ellipse at 8% 20%, rgba(184,135,58,0.10), transparent 40%),
      radial-gradient(ellipse at 95% 75%, rgba(184,135,58,0.10), transparent 40%),
      var(--cream);
    border:1px solid #e9dcb8;
    box-shadow:0 20px 60px rgba(90,65,20,0.15);
    overflow:hidden;
  }

  /* ---------- Hero photo with arc ---------- */
  .hero-wrap{
    position:relative;
    width:100%;
    line-height:0;
  }
  .hero-img{
    width:100%;
    display:block;
    height:260px;
    object-fit:cover;
    object-position:center 30%;
    filter:saturate(1.05) brightness(0.98);
  }
  .arc-mask{
    position:absolute;
    left:-5%; right:-5%; bottom:-1px;
    height:70px;
    background:var(--cream);
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
  }
  .arc-line{
    position:absolute;
    left:-5%; right:-5%; bottom:34px;
    height:70px;
    border-top:3px solid var(--gold);
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
    pointer-events:none;
  }

  /* ---------- flourish divider ---------- */
  .flourish{
    text-align:center;
    color:var(--gold);
    font-size:22px;
    margin:14px 0 6px;
    letter-spacing:6px;
    opacity:0.85;
  }

  /* ---------- names ---------- */
  .names{
    text-align:center;
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:52px;
    color:var(--gold-deep);
    background:linear-gradient(180deg, #cf9f47, #8a6120);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    padding:6px 20px 0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    direction:rtl;
  }
  .heart-icon{
    width:30px; height:30px;
    flex-shrink:0;
    display:inline-flex;
    transform:translateY(4px);
  }

  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:18px auto 14px;
    width:70%;
    color:var(--gold);
  }
  .divider .line{
    flex:1;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .divider .sym{ font-size:14px; }

  .hall-label{
    text-align:center;
    font-size:14px;
    color:#7a6a45;
    letter-spacing:1px;
    margin-bottom:2px;
  }
  .hall-name{
    text-align:center;
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:56px;
    color:var(--gold-deep);
    background:linear-gradient(180deg, #cf9f47, #8a6120);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:14px;
  }

  .pin{
    display:flex;
    justify-content:center;
    margin-bottom:14px;
  }
  .pin svg{ width:26px; height:26px; }

  .address-box{
    margin:0 24px 20px;
    border:1.5px solid var(--gold);
    border-radius:18px;
    padding:16px 18px;
    text-align:center;
    font-size:14.5px;
    line-height:2;
    color:#4a3a1c;
    background:rgba(255,253,245,0.6);
  }

  /* ---------- nav buttons ---------- */
  .nav-buttons{
    display:flex;
    gap:10px;
    margin:0 20px 22px;
  }
  .nav-btn{
    flex:1;
    border:1.5px solid var(--gold-light);
    border-radius:14px;
    padding:12px 6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    text-decoration:none;
    background:#fff;
  }
  .nav-btn .icon{
    width:34px; height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .nav-btn .icon svg{ width:20px; height:20px; }
  .nav-btn .label-top{
    font-size:11px;
    color:#8a7a55;
  }
  .nav-btn .label-name{
    font-size:13px;
    font-weight:700;
  }
  .neshan .icon{ background:#0f9d58; }
  .neshan .label-name{ color:#0f9d58; }
  .balad .icon{ background:#1976d2; }
  .balad .label-name{ color:#1976d2; }
  .gmaps .label-name{ color:#4a3a1c; }

  .footer-divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:6px auto 10px;
    width:70%;
    color:var(--gold);
  }
  .footer-divider .line{
    flex:1; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .wish{
    text-align:center;
    font-size:15px;
    color:#4a3a1c;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }

  .bottom-flourish{
    text-align:center;
    padding-bottom:20px;
    color:var(--gold);
    font-size:20px;
    letter-spacing:5px;
    opacity:0.8;
  }
</style>
</head>
<body>

<div class="card">

  <div class="hero-wrap">
    <img class="hero-img" src="IMG_20260712_033439.jpg" alt="عکس عروس و داماد در مزرعه">
    <div class="arc-mask"></div>
    <div class="arc-line"></div>
  </div>

  <div class="flourish">﴾ ⚜ ﴿</div>

  <div class="names">
    <span>فرشاد</span>
    <svg class="heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
      <path d="M12 21s-7.5-4.7-10-9.3C.3 8.3 2 4.5 5.6 4c2-.3 3.7.8 4.9 2.6C11.7 4.8 13.4 3.7 15.4 4c3.6.5 5.3 4.3 3.6 7.7C16.5 16.3 12 21 12 21z"/>
      <path d="M12 8v6M9.5 11h5" stroke-width="1"/>
    </svg>
    <span>پریا</span>
  </div>

  <div class="divider"><span class="line"></span><span class="sym">✦</span><span class="line"></span></div>

  <div class="hall-label">تالار پذیرایی</div>
  <div class="hall-name">رویال</div>

  <div class="pin">
    <svg viewBox="0 0 24 24" fill="none" stroke="#b8873a" stroke-width="1.5">
      <path d="M12 21s7-7.3 7-12.6A7 7 0 0 0 5 8.4C5 13.7 12 21 12 21z"/>
      <circle cx="12" cy="8.4" r="2.6"/>
    </svg>
  </div>

  <div class="address-box">
    بلوار خاوران، به طرف باسمنج، نرسیده به باغ یعقوب،<br>
    سمت راست ساختمان آی سودا
  </div>

  <div class="nav-buttons">
    <a class="nav-btn neshan" href="https://nshn.ir/rbAOr3QCRxpt" target="_blank" rel="noopener">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2C7 2 3 6 3 11c0 6 9 11 9 11s9-5 9-11c0-5-4-9-9-9zm0 12.5A3.5 3.5 0 1 1 12 7.5a3.5 3.5 0 0 1 0 7z"/></svg>
      </span>
      <span class="label-top">مسیریابی با</span>
      <span class="label-name">نشان</span>
    </a>
    <a class="nav-btn balad" href="https://balad.ir/location?latitude=38.012709&longitude=46.438278&zoom=16.500000" target="_blank" rel="noopener">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2C7 2 3 6 3 11c0 6 9 11 9 11s9-5 9-11c0-5-4-9-9-9zm0 12.5A3.5 3.5 0 1 1 12 7.5a3.5 3.5 0 0 1 0 7z"/></svg>
      </span>
      <span class="label-top">مسیریابی با</span>
      <span class="label-name">بلد</span>
    </a>
    <a class="nav-btn gmaps" href="https://maps.app.goo.gl/9KbByqHbe2xPksna6?g_st=atm" target="_blank" rel="noopener">
      <span class="icon" style="background:#fff; border:1px solid #eee;">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M12 2C7 2 3 6 3 11c0 6 9 11 9 11s9-5 9-11c0-5-4-9-9-9z"/><circle cx="12" cy="11" r="3.6" fill="#fff"/><path fill="#EA4335" d="M12 2C8.5 2 5.5 4.3 4.1 7.6L12 11z"/><path fill="#34A853" d="M4.1 7.6C3.4 8.9 3 10.4 3 11c0 2.4 1.6 5 3.6 7.2L12 11z"/><path fill="#FBBC05" d="M6.6 18.2C8.4 20.2 10.4 21.5 12 22c1.6-.5 3.6-1.8 5.4-3.8L12 11z"/></svg>
      </span>
      <span class="label-top">مسیریابی با</span>
      <span class="label-name">Google Maps</span>
    </a>
  </div>

  <div class="footer-divider">
    <span class="line"></span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b8873a" stroke-width="1.4"><path d="M12 21s-7.5-4.7-10-9.3C.3 8.3 2 4.5 5.6 4c2-.3 3.7.8 4.9 2.6C11.7 4.8 13.4 3.7 15.4 4c3.6.5 5.3 4.3 3.6 7.7C16.5 16.3 12 21 12 21z"/></svg>
    <span class="line"></span>
  </div>

  <div class="wish">
    <span>با آرزوی دیدار شما در جشن پیوندمان</span>
    <span>🖤</span>
  </div>

  <div class="bottom-flourish">﴾ ⚜ ﴿</div>

</div>

</body>
</html>
